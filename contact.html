  <nav>

  <header>
    <h1>Contact</h1>
  </header>

  <main>
    <section>
      <h2>Informasi Kontak</h2>
      <p>Sekolah: [Nama Sekolah]</p>
      <p>Alamat: [Alamat Sekolah]</p>
      <p>Email: kelaskami@sekolah.sch.id</p>
      <p>Telepon: (021) 000-0000</p>
    </section>

    <section>
      <h2>Kirim Pesan</h2>
      <form action="#">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Nama kamu">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email kamu">

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu di sini"></textarea>

        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>
